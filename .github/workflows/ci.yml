# Blocker: this workflow cannot pass on a hosted runner yet. The workspace
# depends on the sibling path crates ruau, tmcp, itty-core, and musq,
# which are not published and are not part of this repository.
# The job stays red until those crates are published, vendored, or checked out
# beside the workspace here. Do not replace it with a passing no-op.
name: CI

on: [push, pull_request]

jobs:
  ci:
    name: canopy - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Keep the existing CI compiler pin; formatting uses the nightly label.
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      - name: Install the format toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install the pinned tools
        run: cargo install cargo-nextest --version 0.9.99 --locked

      # Without -p or --all, cargo fmt formats every workspace member. --all
      # also formats the sibling path dependencies.
      - name: Check formatting
        run: cargo +nightly fmt -- --check --config-path rustfmt.toml

      - name: Check lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check isolated widget capabilities
        run: cargo xtask feature-check

      - name: Compile benchmarks
        run: cargo xtask bench-check

      - name: Check the generated big text faces
        run: cargo xtask big-text --check

      - name: Check the generated xmark specs
        run: cargo xtask xmark-specs --check

      - name: Test workspace
        run: cargo nextest run --workspace --all-features --no-tests fail

      - name: Test smoke scenarios
        run: cargo xtask smoke
