[package]
name = "hello"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minimal Canopy application used as the external-application reference"

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
canopy = { path = "../../crates/canopy" }
canopy-mcp = { version = "0.1.0", path = "../../crates/canopy-mcp" }
