[package]
name = "todo"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
canopy = { path = "../../crates/canopy" }
canopy-mcp = { version = "0.1.0", path = "../../crates/canopy-mcp" }
canopy-widgets = { path = "../../crates/canopy-widgets", default-features = false }
clap.workspace = true
musq = { path = "../../../musq/crates/musq", default-features = false }
pollster = "1.0.1"
textwrap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
canopy = { path = "../../crates/canopy", features = ["testing"] }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
