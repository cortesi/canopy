[package]
name = "canopy"
authors = ["Aldo Cortesi <aldo@corte.si>"]
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
canopy-geom = { path = "../canopy-geom" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
thiserror = "2.0.18"
scopeguard = "1.2.0"
convert_case = "0.11"
termcolor = "1.4.1"
comfy-table = "7.2.2"
color-backtrace = "0.7.2"
tracing = "0.1.44"
canopy-derive = { path = "../canopy-derive" }
slotmap = "1.1.1"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.2.1"
ruau = { path = "../../../../private/ruau/crates/ruau", default-features = false }
tokio = { version = "1.52.3", features = ["rt", "time", "sync"] }
futures = "0.3.32"
parking_lot = "0.12.5"

[dev-dependencies]
rand = "0.10.1"
proptest = "1.11.0"
criterion = "0.8.2"

[features]
testing = []

[lints]
workspace = true
