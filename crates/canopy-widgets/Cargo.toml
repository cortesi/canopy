[package]
name = "canopy-widgets"
authors = ["Aldo Cortesi <aldo@corte.si>"]
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
canopy = { path = "../canopy" }

# Widget-specific dependencies
textwrap = "0.16.2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.2"
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
ropey = "1.6.1"
syntect = "5.3.0"
portable-pty = "0.9.0"
tracing-subscriber = "0.3.23"
fontdue = "0.9.3"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "time", "sync"] }
itty-core = { version = "0.1.0", path = "../../../itty/crates/itty-core" }

[dev-dependencies]
canopy = { path = "../canopy", features = ["testing"] }
criterion = "0.8"
itty-script = { path = "../../../itty/crates/itty-script" }
loom = "0.7.2"
proptest = "1.11.0"

[features]
testing = []

[[bench]]
name = "editor"
harness = false
required-features = ["testing"]

[[bench]]
name = "rendering"
harness = false
required-features = ["testing"]

[lints]
workspace = true
