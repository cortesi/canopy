[package]
name = "canopy-widgets"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license-file = "LICENSE.md"

[lib]
doctest = false

[features]
default = ["syntax", "terminal-widget", "graphics", "devtools"]
syntax = ["dep:syntect", "dep:two-face"]
terminal-widget = ["dep:itty-core"]
graphics = ["dep:image", "dep:fontdue"]
devtools = ["dep:tracing-subscriber"]

[dependencies]
canopy.workspace = true

# Widget-specific dependencies
icu_segmenter.workspace = true
textwrap.workspace = true
unicode-segmentation.workspace = true
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
imara-diff = "0.2.0"
image = { version = "0.25.10", optional = true, default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
ropey = "1.6.1"
# The syntax definitions come from two-face, so syntect's own set is left
# out rather than shipping two copies of it. `yaml-load` reads the bundled Luau
# grammar, which two-face lacks.
syntect = { version = "5.3.0", optional = true, default-features = false, features = [
    "parsing",
    "default-themes",
    "regex-onig",
    "yaml-load",
] }
tracing-subscriber = { workspace = true, optional = true }
fontdue = { version = "0.9.4", optional = true }
itty-core = { workspace = true, optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"], optional = true }

[dev-dependencies]
canopy = { workspace = true, features = ["testing"] }
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true


[[bench]]
name = "editor"
harness = false
required-features = ["syntax"]

[[test]]
name = "logs_subscriber"
required-features = ["devtools"]

[[test]]
name = "luau_grammar"
required-features = ["syntax"]

[[bench]]
name = "keyed"
harness = false

[[bench]]
name = "rendering"
harness = false

[lints]
workspace = true
