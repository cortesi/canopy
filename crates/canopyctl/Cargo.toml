[package]
name = "canopyctl"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
canopy.workspace = true
canopy-mcp.workspace = true
clap.workspace = true
ruau-script-api = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
tmcp.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "net", "time", "sync"] }
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
canopy = { workspace = true, features = ["testing"] }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }
