[package]
name = "canopyctl"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license-file = "LICENSE.md"
description = "Run, automate, and smoke-test Canopy applications"

[dependencies]
anyhow.workspace = true
canopy.workspace = true
canopy-mcp.workspace = true
canopy-mosaic.workspace = true
canopy-term.workspace = true
clap.workspace = true
fontdue.workspace = true
image = { workspace = true, features = ["png"] }
ruau-script-api = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
tmcp.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "net", "time", "sync", "io-util"] }
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
canopy = { workspace = true, features = ["testing"] }
futures.workspace = true
image = { workspace = true, features = ["jpeg"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
